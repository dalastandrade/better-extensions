api_version = "2025-04"
uid = "8427d2e4-22c9-2a9f-256d-e9b6f4d5ff06b2a5a794"

[[extensions]]
type = "ui_extension"
name = "Product Upsells"
handle = "product-upsells"

  [[extensions.targeting]]
  module = "./src/Checkout.jsx"
  target = "purchase.checkout.block.render"

  [extensions.capabilities]
  api_access = true

  [extensions.settings]

    [[extensions.settings.fields]]
    key = "rating_namespace"
    type = "single_line_text_field"
    name = "Rating metafield namespace"
    description = "Namespace of the product metafield holding the star rating (e.g. 'custom', 'reviews', 'okendo', 'yotpo')."

    [[extensions.settings.fields]]
    key = "rating_key"
    type = "single_line_text_field"
    name = "Rating metafield key"
    description = "Key of the product metafield holding the star rating (e.g. 'review_rating', 'rating', 'avg_rating')."
